name: Release

# Bundling is slow and needs a Rust toolchain per platform, so it runs on a tag
# rather than on every push.
#
# Four desktop targets. Everything is unsigned, so first launch needs
# right-click-Open on macOS and a SmartScreen dismissal on Windows; Linux
# AppImage/deb are unaffected.
#
# iOS is deliberately absent: it cannot be produced by tauri-action, needs full
# Xcode and a signing identity, and the touch story is unresolved (see
# docs/building.md). `pnpm ios:*` covers it locally.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  bundle:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # tauri-action creates the draft release and uploads the bundles to it, so
    # GITHUB_TOKEN needs contents:write. The repository default is read-only;
    # scoping it here keeps every other workflow on the read-only default
    # rather than widening the org/repo setting for all of them.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (Apple Silicon)
            args: --target aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
          - os: macos-latest
            label: macOS (Intel)
            args: --target x86_64-apple-darwin
            rust-target: x86_64-apple-darwin
          - os: windows-latest
            label: Windows (x64)
            args: ""
            rust-target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            label: Linux (x86_64)
            args: ""
            rust-target: x86_64-unknown-linux-gnu
          # DGX Spark is Grace/Blackwell — arm64, not x86. A native arm64
          # runner avoids cross-compiling a webkit2gtk link, which is the part
          # that makes Linux cross-builds miserable.
          - os: ubuntu-22.04-arm
            label: Linux (arm64 / DGX)
            args: ""
            rust-target: aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.rust-target }}

      # Tauri links against the system webview. 22.04 ships webkit2gtk-4.1,
      # which is what Tauri 2 wants; 24.04 dropped libappindicator3 and would
      # need ayatana instead, so the runner version here is load-bearing.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libssl-dev build-essential curl wget file \
            xdg-utils

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the app bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_OPENBB_API_URL: ${{ vars.VITE_OPENBB_API_URL }}
          VITE_RITA_URL: ${{ vars.VITE_RITA_URL }}
          VITE_MCP_SERVERS: ${{ vars.VITE_MCP_SERVERS }}
          # Omitted before, so a released build had no fs:scope entry for the
          # share folders and every "Send to…" file target failed at write.
          VITE_SHARE_FOLDERS: ${{ vars.VITE_SHARE_FOLDERS }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: BDOBB ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
