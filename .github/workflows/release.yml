name: Release

# Vite copies VITE_* into the installer frontend. Explicit empty values
# take precedence over .env files while users retain their saved settings.
env:
  VITE_OPENBB_API_URL: ''
  VITE_RITA_URL: ''
  VITE_MCP_SERVERS: ''
  VITE_SHARE_FOLDERS: ''

# Bundling is slow and needs a Rust toolchain per platform, so it runs on a tag
# rather than on every push.
#
# Four desktop targets. Everything is unsigned, so first launch needs
# right-click-Open on macOS and a SmartScreen dismissal on Windows; Linux
# AppImage/deb are unaffected.
#
# iOS is deliberately absent: it cannot be produced by tauri-action, needs full
# Xcode and a signing identity, and the touch story is unresolved (see
# docs/building.md). `pnpm ios:*` covers it locally.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  bundle:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (Apple Silicon)
            args: --target aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
          - os: macos-latest
            label: macOS (Intel)
            args: --target x86_64-apple-darwin
            rust-target: x86_64-apple-darwin
          - os: windows-latest
            label: Windows (x64)
            args: ""
            rust-target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            label: Linux (x86_64)
            args: ""
            rust-target: x86_64-unknown-linux-gnu
          # DGX Spark is Grace/Blackwell — arm64, not x86. A native arm64
          # runner avoids cross-compiling a webkit2gtk link, which is the part
          # that makes Linux cross-builds miserable.
          - os: ubuntu-22.04-arm
            label: Linux (arm64 / DGX)
            args: ""
            rust-target: aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.rust-target }}

      # Tauri links against the system webview. 22.04 ships webkit2gtk-4.1,
      # which is what Tauri 2 wants; 24.04 dropped libappindicator3 and would
      # need ayatana instead, so the runner version here is load-bearing.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libssl-dev build-essential curl wget file \
            xdg-utils libarchive-tools squashfs-tools

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installers locally on the runner
        id: build
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the embedded frontend extractor
        run: cargo install tauri-dumper --version 0.2.2 --locked

      - name: Reject private defaults in the exact installers
        env:
          BDOBB_ARTIFACT_PATHS: ${{ steps.build.outputs.artifactPaths }}
          BDOBB_RUST_TARGET: ${{ matrix.rust-target }}
        run: |
          python -m unittest discover -s scripts -p test_public_release.py
          python scripts/public-release.py stage

      - uses: actions/upload-artifact@v4
        with:
          name: scanned-${{ matrix.rust-target }}
          path: release-stage/
          if-no-files-found: error

  draft:
    # Manual dispatches leave scanned artifacts on the run for review.
    if: github.ref_type == 'tag'
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: scanned-*
          path: staged
      - name: Verify the scanned digest of every package
        run: python scripts/verify-staged.py staged verified
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [ "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')" ]
          gh release create "$GITHUB_REF_NAME" verified/* --verify-tag --draft --title "BDOBB $GITHUB_REF_NAME"
