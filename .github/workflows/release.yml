name: V3 installer qualification
run-name: V3 final installer qualification (${{ inputs.version }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: Pinned V3 only; no release publication
        required: true
        type: choice
        default: v3.0.0
        options: [v3.0.0]
      mode:
        description: Build qualification or exact-artifact installation; install never rebuilds
        required: true
        type: choice
        default: build
        options: [build, install, retained-linux]
      retained_manifest_json:
        description: Held until root clears exact retained Linux bytes; external approved manifest
        required: false
        type: string
        default: ''
      retained_manifest_sha256:
        description: Independently reviewed SHA256 of exact UTF8 retained manifest input
        required: false
        type: string
        default: ''
      target:
        description: Native target to qualify; retry only failed targets
        required: true
        type: choice
        default: all
        options: [all, mac-arm, mac-intel, windows, linux-x64, linux-arm]

permissions:
  contents: read

concurrency:
  group: v3-installer-qualification-${{ github.ref }}-${{ inputs.mode || 'build' }}-${{ inputs.target || 'all' }}
  cancel-in-progress: false

env:
  SOURCE_COMMIT: de25611461ad0559ce237c4f59b812decd91dec1
  SOURCE_REPOSITORY: https://github.com/Adventures-OpenBQ/bdobb.git
  RUSTUP_TOOLCHAIN: 1.99.1
  AUDITOR_COMMIT: 60866feb4f0e933f9264628c12911be810516de0
  PYTHONUTF8: '1'
  VITE_OPENBB_API_URL: ''
  VITE_RITA_URL: ''
  VITE_MCP_SERVERS: ''
  VITE_SHARE_FOLDERS: ''
  VITE_DEFAULT_BACKEND_URL: ''
  VITE_DEFAULT_BACKEND_AUTH: ''
  CARGO_INCREMENTAL: '0'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  plan:
    if: github.repository == 'artcashin/bdobb' && github.event_name == 'workflow_dispatch' && inputs.version == 'v3.0.0'
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: bash
        env:
          SELECTED_TARGET: ${{ inputs.target }}
          SELECTED_MODE: ${{ inputs.mode }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          rows = [
              {'target':'mac-arm','os':'macos-15','rust-target':'aarch64-apple-darwin'},
              {'target':'mac-intel','os':'macos-15-intel','rust-target':'x86_64-apple-darwin'},
              {'target':'windows','os':'windows-2022','rust-target':'x86_64-pc-windows-msvc'},
              {'target':'linux-x64','os':'ubuntu-22.04','rust-target':'x86_64-unknown-linux-gnu'},
              {'target':'linux-arm','os':'ubuntu-22.04-arm','rust-target':'aarch64-unknown-linux-gnu'},
          ]
          assert os.environ['SELECTED_MODE'] in {'build', 'install', 'retained-linux'}
          if os.environ['SELECTED_MODE'] == 'retained-linux':
              rows = [row for row in rows if row['target'].startswith('linux-')]
          if os.environ['SELECTED_MODE'] == 'install':
              rows = [row for row in rows if row['target'] != 'linux-arm']
          selected = os.environ['SELECTED_TARGET'] or 'all'
          assert selected == 'all' or selected in {row['target'] for row in rows}
          matrix = {'include':[row for row in rows if selected == 'all' or row['target'] == selected]}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('matrix=' + json.dumps(matrix), file=output)
          PYTHON

  bundle:
    needs: plan
    if: inputs.mode == 'build' && github.repository == 'artcashin/bdobb' && github.event_name == 'workflow_dispatch' && inputs.version == 'v3.0.0'
    name: V3 ${{ matrix.target }} native qualification
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash
        working-directory: app
    env:
      BDOBB_RUST_TARGET: ${{ matrix.rust-target }}
      BDOBB_TARGET: ${{ matrix.target }}
    steps:
      - name: Check out qualification controller separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: controller
          persist-credentials: false

      - name: Fetch only the explicitly pinned public V3 source
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir app
          git -C app init
          git -C app config core.autocrlf false
          git -C app remote add release-source "$SOURCE_REPOSITORY"
          git -C app fetch --no-tags release-source "$SOURCE_COMMIT"
          git -C app checkout --detach FETCH_HEAD
          test "$(git -C app rev-parse HEAD)" = "$SOURCE_COMMIT"
          mkdir auditor
          git -C auditor init
          git -C auditor config core.autocrlf false
          git -C auditor remote add release-source "$SOURCE_REPOSITORY"
          git -C auditor fetch --no-tags release-source "$AUDITOR_COMMIT"
          git -C auditor checkout --detach FETCH_HEAD
          test "$(git -C auditor rev-parse HEAD)" = "$AUDITOR_COMMIT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install pinned compiler, package manager, and decoder
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal
          rustup target add "$BDOBB_RUST_TARGET" --toolchain 1.99.1
          corepack enable
          corepack prepare pnpm@10.34.4 --activate
          test "$(pnpm --version)" = '10.34.4'
          cargo install tauri-dumper --version 0.2.2 --locked --root "$RUNNER_TEMP/v3-tools"
          python ../auditor/security/install.py --dir "$RUNNER_TEMP/v3-tools/bin"
          python -m pip install --require-hashes -r ../auditor/security/requirements.txt
          echo "$RUNNER_TEMP/v3-tools/bin" >> "$GITHUB_PATH"

      - name: Install Linux build, extraction, OCR, and display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libssl-dev build-essential \
            curl wget file xdg-utils libarchive-tools squashfs-tools p7zip-full \
            tesseract-ocr poppler-utils xvfb xauth xdotool dbus-x11

      - name: Install macOS OCR and extraction tools
        if: runner.os == 'macOS'
        run: brew install tesseract poppler sevenzip

      - name: Prepare pinned Windows scanner tools without Chocolatey
        if: runner.os == 'Windows'
        working-directory: ${{ github.workspace }}
        run: |
          python controller/.github/scripts/windows_scanner_tools.py \
            --app app --auditor auditor --controller controller \
            --outdir "$RUNNER_TEMP/v3-windows-scanner-tools"

      - name: Verify exact source, toolchain, and empty build defaults
        run: |
          set -euo pipefail
          rustc --version
          gitleaks version
          tauri-dumper --version
          python - <<'PYTHON'
          import json, os, platform, subprocess
          from pathlib import Path
          expected = '19c760a782e0ab84152ee990e8f9014f7e677f448bc58d6a3e548d8f485f1c6b'
          assert subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() == os.environ['SOURCE_COMMIT']
          assert subprocess.check_output(['rustc','--version'], text=True).split()[1] == '1.99.1'
          for file in ['package.json', 'src-tauri/tauri.conf.json']:
              assert json.loads(Path(file).read_text())['version'] == '3.0.0'
          assert json.loads(Path('package.json').read_text())['packageManager'] == 'pnpm@10.34.4'
          assert json.loads(Path('source-offer.json').read_text())['sourceId'] == expected
          for key in ['VITE_OPENBB_API_URL','VITE_RITA_URL','VITE_MCP_SERVERS','VITE_SHARE_FOLDERS','VITE_DEFAULT_BACKEND_URL','VITE_DEFAULT_BACKEND_AUTH']:
              assert os.environ.get(key) == '', key
          Path('qualification-evidence').mkdir()
          receipt = {'source_commit':os.environ['SOURCE_COMMIT'], 'source_id':expected,
              'controller_commit':subprocess.check_output(['git','-C','../controller','rev-parse','HEAD'],text=True).strip(),
              'auditor_commit':subprocess.check_output(['git','-C','../auditor','rev-parse','HEAD'],text=True).strip(),
              'target':os.environ['BDOBB_RUST_TARGET'], 'host_arch':platform.machine(),
              'rustc':subprocess.check_output(['rustc','--version'],text=True).strip(),
              'pnpm':'10.34.4', 'node':subprocess.check_output(['node','--version'],text=True).strip(),
              'gitleaks':subprocess.check_output(['gitleaks','version'],text=True).strip(),
              'runner_image':os.environ.get('ImageVersion'), 'signing':'ad hoc/unsigned; no notarization or Gatekeeper qualification'}
          Path('qualification-evidence/build-identity.json').write_text(json.dumps(receipt,indent=2))
          if os.name == 'nt':
              import shutil
              shutil.copyfile(Path(os.environ['RUNNER_TEMP'])/'v3-windows-scanner-tools/windows-scanner-tools.json', 'qualification-evidence/windows-scanner-tools.json')
          PYTHON

      - name: Verify source-owned security policy and scanner failure controls
        run: |
          set -euo pipefail
          python ../auditor/security/sync.py --check
          python ../controller/.github/scripts/run_auditor_controls.py --auditor ../auditor --evidence qualification-evidence
          python -m unittest discover -s ../controller/.github/scripts -p test_v3_qualification.py -v
          python -m unittest discover -s ../controller/.github/scripts -p test_windows_scanner_tools.py -v
          python ../auditor/security/gate.py --repo . tree
          python ../auditor/security/gate.py --repo . history --revision HEAD
          python ../auditor/security/gate.py --repo . artifacts ../controller/.github/workflows/release.yml ../controller/.github/scripts

      - name: Install locked app dependencies
        run: pnpm install --frozen-lockfile

      - name: Build only final V3 installers
        id: native_build
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: pnpm tauri build --ci --target "$BDOBB_RUST_TARGET" -- --locked

      - name: Stage original filenames and scan exact installed bytes with source policy
        id: package_scan
        run: python ../controller/.github/scripts/v3_qualification.py collect --target "$BDOBB_TARGET" --auditor ../auditor

      - name: Qualify every exact package on native Linux in fresh profiles
        id: linux_qualification
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a python ../controller/.github/scripts/v3_qualification.py qualify --target "$BDOBB_TARGET" --auditor ../auditor

      - name: Qualify every exact package on native macOS or Windows in fresh profiles
        if: runner.os != 'Linux'
        run: python ../controller/.github/scripts/v3_qualification.py qualify --target "$BDOBB_TARGET" --auditor ../auditor

      - name: Check final package binding, checksums, and qualification evidence
        id: evidence_scan
        run: |
          set -euo pipefail
          # Packages already passed source-owned format-specific unpacking and
          # decoded-frontend scans. Scan the newly generated text and evidence;
          # the generic artifact gate deliberately rejects raw Linux packages.
          python ../auditor/security/gate.py --repo . artifacts release-stage/scan.json release-stage/qualification.json release-stage/SHA256SUMS qualification-evidence
          git diff --exit-code

      - name: Upload scanned installers and qualification receipts only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualified-v3-${{ matrix.target }}
          path: |
            app/release-stage/
            app/qualification-evidence/
          if-no-files-found: error
          retention-days: 7

      - name: Encrypt only blocked Linux candidates for root-held private QA
        id: encrypted_qa
        if: failure() && runner.os == 'Linux' && steps.native_build.outcome == 'success' && (steps.package_scan.outcome == 'failure' || steps.linux_qualification.outcome == 'failure' || steps.evidence_scan.outcome == 'failure')
        working-directory: ${{ github.workspace }}
        env:
          PACKAGE_SCAN_OUTCOME: ${{ steps.package_scan.outcome }}
          NATIVE_QUALIFICATION_OUTCOME: ${{ steps.linux_qualification.outcome }}
        run: |
          set -euo pipefail
          if [ "$PACKAGE_SCAN_OUTCOME" = failure ]; then
            failure_stage=package-scan
          elif [ "$NATIVE_QUALIFICATION_OUTCOME" = failure ]; then
            failure_stage=native-qualification
          else
            failure_stage=evidence-scan
          fi
          python controller/.github/scripts/encrypt_linux_candidates.py \
            --target "$BDOBB_TARGET" --app app --auditor auditor --controller controller \
            --recipient age1uxxwajvn8cc73sr6pgzktjjef33mfawxev3w6766a80j5cqupf4s7m0rd8 \
            --outdir "$RUNNER_TEMP/v3-encrypted-qa-$BDOBB_TARGET" \
            --failure-stage "$failure_stage" --qualification-outcome failure

      - name: Scan encrypted QA envelope and safe receipt only
        id: encrypted_qa_outbound
        if: failure() && steps.encrypted_qa.outcome == 'success'
        working-directory: ${{ github.workspace }}
        run: |
          python auditor/security/gate.py --repo app artifacts \
            "$RUNNER_TEMP/v3-encrypted-qa-$BDOBB_TARGET/retention.json" \
            "$RUNNER_TEMP/v3-encrypted-qa-$BDOBB_TARGET/qa-blocked-v3-$BDOBB_TARGET.tar.age"

      - name: Retain encrypted BLOCKED QA only for one day
        if: failure() && steps.encrypted_qa.outcome == 'success' && steps.encrypted_qa_outbound.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: QA-ENCRYPTED-BLOCKED-v3-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/v3-encrypted-qa-${{ matrix.target }}/qa-blocked-v3-${{ matrix.target }}.tar.age
            ${{ runner.temp }}/v3-encrypted-qa-${{ matrix.target }}/retention.json
          if-no-files-found: error
          retention-days: 1

  verify-all12:
    if: inputs.mode == 'build' && (inputs.target == 'all' || inputs.target == '')
    name: Verify all twelve original V3 installer bindings
    needs: bundle
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: controller
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: qualified-v3-*
          path: staged
      - name: Require twelve original names, final source identity, native smoke, and exact scanned digests
        run: python controller/.github/scripts/v3_qualification.py aggregate --root staged
      - name: Upload binding report only; no release mutation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualified-v3-all12-binding
          path: qualification-all12/
          if-no-files-found: error
          retention-days: 7

  install:
    needs: plan
    permissions:
      contents: read
      actions: read
    if: inputs.mode == 'install' && github.repository == 'artcashin/bdobb' && github.event_name == 'workflow_dispatch' && inputs.version == 'v3.0.0'
    name: Install exact V3 ${{ matrix.target }} package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out reviewed supplement from dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: supplement-controller
          persist-credentials: false
      - name: Check out exact original runtime reference controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 205d83afce56d13dfdc8d91ec3e311c977b33bd4
          path: runtime-controller
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Require exact successful native job and immutable original artifact
        id: original
        env:
          GH_READ_TOKEN: ${{ github.token }}
          SUPPLEMENT_TARGET: ${{ matrix.target }}
        run: python supplement-controller/.github/scripts/v3-install-supplement/install_supplement.py verify-run --target "$SUPPLEMENT_TARGET" --evidence install-evidence
      - name: Download only this native target from exact original run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ steps.original.outputs.artifact_id }}
          path: original-artifact
          merge-multiple: true
          repository: artcashin/bdobb
          run-id: ${{ steps.original.outputs.build_run }}
          github-token: ${{ github.token }}
      - name: Fetch original public scanner source explicitly; no app build
        run: |
          set -euo pipefail
          mkdir app
          git -C app init
          git -C app config core.autocrlf false
          git -C app remote add release-source https://github.com/Adventures-OpenBQ/bdobb.git
          git -C app fetch --no-tags release-source "$SOURCE_COMMIT"
          git -C app checkout --detach FETCH_HEAD
          test "$(git -C app rev-parse HEAD)" = "$SOURCE_COMMIT"
          mkdir auditor
          git -C auditor init
          git -C auditor config core.autocrlf false
          git -C auditor remote add release-source https://github.com/Adventures-OpenBQ/bdobb.git
          git -C auditor fetch --no-tags release-source "$AUDITOR_COMMIT"
          git -C auditor checkout --detach FETCH_HEAD
          test "$(git -C auditor rev-parse HEAD)" = "$AUDITOR_COMMIT"
      - name: Install pinned scanner and installed-frontend decoder only
        working-directory: auditor
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal
          cargo install tauri-dumper --version 0.2.2 --locked --root "$RUNNER_TEMP/v3-tools"
          python security/install.py --dir "$RUNNER_TEMP/v3-tools/bin"
          python -m pip install --require-hashes -r security/requirements.txt
          echo "$RUNNER_TEMP/v3-tools/bin" >> "$GITHUB_PATH"
      - name: Install Linux runtime, scanner, and display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libgtk-3-dev libssl-dev \
            libarchive-tools squashfs-tools p7zip-full tesseract-ocr poppler-utils xvfb xauth xdotool dbus-x11 xdg-utils
      - name: Install macOS scanner tools
        if: runner.os == 'macOS'
        run: brew install tesseract poppler sevenzip
      - name: Prepare pinned Windows scanner tools without Chocolatey
        if: runner.os == 'Windows'
        working-directory: ${{ github.workspace }}
        run: |
          python supplement-controller/.github/scripts/windows_scanner_tools.py \
            --app app --auditor auditor --controller supplement-controller \
            --outdir "$RUNNER_TEMP/v3-windows-scanner-tools"
          cp "$RUNNER_TEMP/v3-windows-scanner-tools/windows-scanner-tools.json" install-evidence/windows-scanner-tools.json

      - name: Verify supplement tests and source-owned scanning policy
        working-directory: app
        run: |
          set -euo pipefail
          python -m unittest discover -s ../supplement-controller/.github/scripts/v3-install-supplement -p test_install_supplement.py -v
          python -m unittest discover -s ../supplement-controller/.github/scripts -p test_mac_about_probe.py -v
          python ../auditor/security/sync.py --check
          python ../auditor/security/gate.py --repo . artifacts ../supplement-controller/.github/scripts ../supplement-controller/.github/workflows/release.yml
      - name: Verify Windows displayed-release observation classifier
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell -NoProfile -File supplement-controller/.github/scripts/test_windows_ui_observation.ps1
      - name: Actually install and launch exact DEB using private runtime profile
        if: runner.os == 'Linux'
        env:
          SUPPLEMENT_TARGET: ${{ matrix.target }}
        run: |
          dbus-run-session -- xvfb-run -a python supplement-controller/.github/scripts/v3-install-supplement/install_supplement.py install \
            --controller runtime-controller --app app --auditor auditor --artifacts original-artifact --target "$SUPPLEMENT_TARGET" --evidence install-evidence
      - name: Actually install and launch exact MSI or DMG app copy using fresh profile
        if: runner.os != 'Linux'
        env:
          SUPPLEMENT_TARGET: ${{ matrix.target }}
        run: |
          python supplement-controller/.github/scripts/v3-install-supplement/install_supplement.py install \
            --controller runtime-controller --app app --auditor auditor --artifacts original-artifact --target "$SUPPLEMENT_TARGET" --evidence install-evidence
      - name: Scan new installation, registration, cleanup and runtime evidence
        run: |
          set -euo pipefail
          python auditor/security/gate.py --repo app artifacts install-evidence
          git -C app diff --exit-code
      - name: Upload only scanned supplemental evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installed-v3-${{ matrix.target }}-from-${{ steps.original.outputs.build_run }}
          path: install-evidence/
          if-no-files-found: error
          retention-days: 7

  retained_linux:
    needs: plan
    if: inputs.mode == 'retained-linux' && github.repository == 'artcashin/bdobb' && github.event_name == 'workflow_dispatch' && inputs.version == 'v3.0.0'
    name: Post-review same-byte V3 ${{ matrix.target }} qualification
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      RETAINED_TARGET: ${{ matrix.target }}
      RETAINED_MANIFEST_SHA256: ${{ inputs.retained_manifest_sha256 }}
    steps:
      - name: Check out independently reviewed qualification controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: controller
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Materialize only independently approved exact-byte manifest
        env:
          RETAINED_MANIFEST_JSON: ${{ inputs.retained_manifest_json }}
        run: |
          python controller/.github/scripts/v3-linux-retained/retained_linux.py materialize \
            --manifest "$RUNNER_TEMP/v3-retained-input.json" --manifest-sha256 "$RETAINED_MANIFEST_SHA256" \
            --target "$RETAINED_TARGET" --controller-root controller
      - name: Require explicit root approval before any draft asset access
        id: approved
        run: |
          python controller/.github/scripts/v3-linux-retained/retained_linux.py preflight \
            --manifest "$RUNNER_TEMP/v3-retained-input.json" --manifest-sha256 "$RETAINED_MANIFEST_SHA256" \
            --target "$RETAINED_TARGET" --controller-root controller --evidence retained-evidence
      - name: Read only exact privacy-cleared retained draft asset IDs
        env:
          GH_RETAINED_READ_TOKEN: ${{ github.token }}
        run: |
          python controller/.github/scripts/v3-linux-retained/retained_linux.py download \
            --manifest "$RUNNER_TEMP/v3-retained-input.json" --manifest-sha256 "$RETAINED_MANIFEST_SHA256" \
            --target "$RETAINED_TARGET" --controller-root controller --evidence retained-evidence \
            --output "$RUNNER_TEMP/v3-retained-$RETAINED_TARGET"
      - name: Fetch original product and exact Linux-only audit policy; no app build
        env:
          RETAINED_AUDITOR_COMMIT: ${{ steps.approved.outputs.auditor_commit }}
        run: |
          set -euo pipefail
          mkdir app auditor
          git -C app init
          git -C app config core.autocrlf false
          git -C app remote add release-source "$SOURCE_REPOSITORY"
          git -C app fetch --no-tags release-source "$SOURCE_COMMIT"
          git -C app checkout --detach FETCH_HEAD
          test "$(git -C app rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$RETAINED_AUDITOR_COMMIT" = dd0689369f36793875a0b865fa37b47f3ae47e33
          git -C auditor init
          git -C auditor config core.autocrlf false
          git -C auditor remote add release-source "$SOURCE_REPOSITORY"
          git -C auditor fetch --no-tags release-source "$RETAINED_AUDITOR_COMMIT"
          git -C auditor checkout --detach FETCH_HEAD
          test "$(git -C auditor rev-parse HEAD)" = "$RETAINED_AUDITOR_COMMIT"
      - name: Install pinned audit tools and native runtime QA dependencies only
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libgtk-3-dev libssl-dev \
            libarchive-tools squashfs-tools p7zip-full rpm tesseract-ocr poppler-utils xvfb xauth xdotool dbus-x11 \
            xdg-utils python3-pyatspi python3-gi at-spi2-core
          rustup toolchain install 1.99.1 --profile minimal
          cargo install tauri-dumper --version 0.2.2 --locked --root "$RUNNER_TEMP/v3-tools"
          python auditor/security/install.py --dir "$RUNNER_TEMP/v3-tools/bin"
          python -m pip install --require-hashes -r auditor/security/requirements.txt
          echo "$RUNNER_TEMP/v3-tools/bin" >> "$GITHUB_PATH"
      - name: Verify all Linux auditor controls and unmodified source/controller policy
        run: |
          set -euo pipefail
          python auditor/security/sync.py --check
          python controller/.github/scripts/run_auditor_controls.py --auditor auditor --evidence retained-evidence
          python -m unittest discover -s controller/.github/scripts -p 'test_*.py' -v
          python -m unittest discover -s controller/.github/scripts/v3-linux-retained -p 'test_*.py' -v
          python auditor/security/gate.py --repo app tree
          python auditor/security/gate.py --repo app history --revision HEAD
          python auditor/security/gate.py --repo app artifacts controller/.github/scripts controller/.github/workflows/release.yml
      - name: Rescan exact retained bytes, launch every format, and install native DEB
        run: |
          dbus-run-session -- xvfb-run -a env V3_OWNED_QA_SESSION=1 \
            python controller/.github/scripts/v3-linux-retained/qualify_retained.py \
              --manifest "$RUNNER_TEMP/v3-retained-input.json" --manifest-sha256 "$RETAINED_MANIFEST_SHA256" \
              --controller controller --app app --auditor auditor --target "$RETAINED_TARGET" \
              --downloaded "$RUNNER_TEMP/v3-retained-$RETAINED_TARGET" --evidence retained-evidence
      - name: Scan new receipts and require unchanged source; package bytes already format-scanned
        run: |
          set -euo pipefail
          python auditor/security/gate.py --repo app artifacts retained-evidence \
            app/release-stage/scan.json app/release-stage/qualification.json app/release-stage/SHA256SUMS
          git -C app diff --exit-code
          git -C controller diff --exit-code
      - name: Upload post-review same-byte qualification only after every required gate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: requalified-retained-v3-${{ matrix.target }}
          path: |
            app/release-stage/
            retained-evidence/
          if-no-files-found: error
          retention-days: 7
