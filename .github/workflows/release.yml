name: V3 installer qualification
run-name: V3 final installer qualification (${{ inputs.version }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: Pinned V3 only; no release publication
        required: true
        type: choice
        default: v3.0.0
        options: [v3.0.0]

permissions:
  contents: read

concurrency:
  group: v3-installer-qualification-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_COMMIT: de25611461ad0559ce237c4f59b812decd91dec1
  SOURCE_REPOSITORY: https://github.com/Adventures-OpenBQ/bdobb.git
  RUSTUP_TOOLCHAIN: 1.99.1
  VITE_OPENBB_API_URL: ''
  VITE_RITA_URL: ''
  VITE_MCP_SERVERS: ''
  VITE_SHARE_FOLDERS: ''
  VITE_DEFAULT_BACKEND_URL: ''
  VITE_DEFAULT_BACKEND_AUTH: ''
  CARGO_INCREMENTAL: '0'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  bundle:
    if: github.repository == 'artcashin/bdobb' && github.event_name == 'workflow_dispatch' && inputs.version == 'v3.0.0'
    name: V3 ${{ matrix.target }} native qualification
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac-arm
            os: macos-15
            rust-target: aarch64-apple-darwin
          - target: mac-intel
            os: macos-15-intel
            rust-target: x86_64-apple-darwin
          - target: windows
            os: windows-2022
            rust-target: x86_64-pc-windows-msvc
          - target: linux-x64
            os: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
          - target: linux-arm
            os: ubuntu-22.04-arm
            rust-target: aarch64-unknown-linux-gnu
    defaults:
      run:
        shell: bash
        working-directory: app
    env:
      BDOBB_RUST_TARGET: ${{ matrix.rust-target }}
      BDOBB_TARGET: ${{ matrix.target }}
    steps:
      - name: Check out qualification controller separately
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: controller
          persist-credentials: false

      - name: Fetch only the explicitly pinned public V3 source
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir app
          git -C app init
          git -C app remote add release-source "$SOURCE_REPOSITORY"
          git -C app fetch --no-tags release-source "$SOURCE_COMMIT"
          git -C app checkout --detach FETCH_HEAD
          test "$(git -C app rev-parse HEAD)" = "$SOURCE_COMMIT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install pinned compiler, package manager, and decoder
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal
          rustup target add "$BDOBB_RUST_TARGET" --toolchain 1.99.1
          corepack enable
          corepack prepare pnpm@10.34.4 --activate
          test "$(pnpm --version)" = '10.34.4'
          cargo install tauri-dumper --version 0.2.2 --locked --root "$RUNNER_TEMP/v3-tools"
          python security/install.py --dir "$RUNNER_TEMP/v3-tools/bin"
          python -m pip install --require-hashes -r security/requirements.txt
          echo "$RUNNER_TEMP/v3-tools/bin" >> "$GITHUB_PATH"

      - name: Install Linux build, extraction, OCR, and display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libssl-dev build-essential \
            curl wget file xdg-utils libarchive-tools squashfs-tools p7zip-full \
            tesseract-ocr poppler-utils xvfb xauth xdotool dbus-x11

      - name: Install macOS OCR and extraction tools
        if: runner.os == 'macOS'
        run: brew install tesseract poppler sevenzip

      - name: Install Windows OCR and extraction tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install --yes --no-progress tesseract poppler 7zip
          if ($LASTEXITCODE -ne 0) { throw 'Required publication extractor installation failed' }
          @('C:\Program Files\7-Zip', 'C:\Program Files\Tesseract-OCR') | Add-Content $env:GITHUB_PATH
          $pdf = Get-ChildItem 'C:\ProgramData\chocolatey\lib\poppler' -Recurse -Filter pdfinfo.exe | Select-Object -First 1
          if (-not $pdf) { throw 'Poppler executable not found' }
          $pdf.Directory.FullName | Add-Content $env:GITHUB_PATH

      - name: Verify exact source, toolchain, and empty build defaults
        run: |
          set -euo pipefail
          rustc --version
          gitleaks version
          tauri-dumper --version
          python - <<'PYTHON'
          import json, os, platform, subprocess
          from pathlib import Path
          expected = '19c760a782e0ab84152ee990e8f9014f7e677f448bc58d6a3e548d8f485f1c6b'
          assert subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() == os.environ['SOURCE_COMMIT']
          assert subprocess.check_output(['rustc','--version'], text=True).split()[1] == '1.99.1'
          for file in ['package.json', 'src-tauri/tauri.conf.json']:
              assert json.loads(Path(file).read_text())['version'] == '3.0.0'
          assert json.loads(Path('package.json').read_text())['packageManager'] == 'pnpm@10.34.4'
          assert json.loads(Path('source-offer.json').read_text())['sourceId'] == expected
          for key in ['VITE_OPENBB_API_URL','VITE_RITA_URL','VITE_MCP_SERVERS','VITE_SHARE_FOLDERS','VITE_DEFAULT_BACKEND_URL','VITE_DEFAULT_BACKEND_AUTH']:
              assert os.environ.get(key) == '', key
          Path('qualification-evidence').mkdir()
          receipt = {'source_commit':os.environ['SOURCE_COMMIT'], 'source_id':expected,
              'controller_commit':subprocess.check_output(['git','-C','../controller','rev-parse','HEAD'],text=True).strip(),
              'target':os.environ['BDOBB_RUST_TARGET'], 'host_arch':platform.machine(),
              'rustc':subprocess.check_output(['rustc','--version'],text=True).strip(),
              'pnpm':'10.34.4', 'node':subprocess.check_output(['node','--version'],text=True).strip(),
              'gitleaks':subprocess.check_output(['gitleaks','version'],text=True).strip(),
              'runner_image':os.environ.get('ImageVersion'), 'signing':'ad hoc/unsigned; no notarization or Gatekeeper qualification'}
          Path('qualification-evidence/build-identity.json').write_text(json.dumps(receipt,indent=2))
          PYTHON

      - name: Verify source-owned security policy and scanner failure controls
        run: |
          set -euo pipefail
          python security/sync.py --check
          python -m unittest discover -s security -p test_gate.py -v
          python -m unittest discover -s scripts -p test_public_release.py -v
          python -m unittest discover -s ../controller/.github/scripts -p test_v3_qualification.py -v
          python security/gate.py tree
          python security/gate.py history --revision HEAD
          python security/gate.py artifacts ../controller/.github/workflows/release.yml ../controller/.github/scripts

      - name: Install locked app dependencies
        run: pnpm install --frozen-lockfile

      - name: Build only final V3 installers
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: pnpm tauri build --ci --target "$BDOBB_RUST_TARGET" -- --locked

      - name: Stage original filenames and scan exact installed bytes with source policy
        run: python ../controller/.github/scripts/v3_qualification.py collect --target "$BDOBB_TARGET"

      - name: Qualify every exact package on native Linux in fresh profiles
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a python ../controller/.github/scripts/v3_qualification.py qualify --target "$BDOBB_TARGET"

      - name: Qualify every exact package on native macOS or Windows in fresh profiles
        if: runner.os != 'Linux'
        run: python ../controller/.github/scripts/v3_qualification.py qualify --target "$BDOBB_TARGET"

      - name: Check final package binding, checksums, and qualification evidence
        run: |
          set -euo pipefail
          # Packages already passed source-owned format-specific unpacking and
          # decoded-frontend scans. Scan the newly generated text and evidence;
          # the generic artifact gate deliberately rejects raw Linux packages.
          python security/gate.py artifacts release-stage/scan.json release-stage/qualification.json release-stage/SHA256SUMS qualification-evidence
          git diff --exit-code

      - name: Upload scanned installers and qualification receipts only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualified-v3-${{ matrix.target }}
          path: |
            app/release-stage/
            app/qualification-evidence/
          if-no-files-found: error
          retention-days: 7

  verify-all12:
    name: Verify all twelve original V3 installer bindings
    needs: bundle
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: controller
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: qualified-v3-*
          path: staged
      - name: Require twelve original names, final source identity, native smoke, and exact scanned digests
        run: python controller/.github/scripts/v3_qualification.py aggregate --root staged
      - name: Upload binding report only; no release mutation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualified-v3-all12-binding
          path: qualification-all12/
          if-no-files-found: error
          retention-days: 7
