[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "symphony-bridge"
version = "1.0.0"
description = "Bot-identity bridge between BDOBB and Symphony Messaging"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "mcp>=1.2",
]

[project.optional-dependencies]
# "sym-api-client-python" (the old REST-only client, no `symphony.bdk`
# namespace, tops out at 1.3.x on PyPI) was declared here but the code in
# app/live_client.py imports from `symphony.bdk.core...` -- that namespace is
# provided only by "symphony-bdk-python" (the FINOS Symphony BDK, PyPI name
# `symphony-bdk-python`, importable as `symphony.bdk`), which is also what
# the design spec calls for ("Symphony BDK, Python BDK preferred"). Fixed to
# match the actual import.
dev = ["pytest", "pytest-asyncio", "httpx", "ruff"]
live = ["symphony-bdk-python>=2.0"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
